<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy | Good Boy, Rocky!</title>
  <style>
    :root { --primary: #c2956e; --dark: #1a1a1a; --accent: #f4ece4; --text: #333; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--accent); color: var(--text); margin: 0; padding: 0; }
    header { background: var(--dark); color: white; padding: 50px 20px; text-align: center; border-bottom: 6px solid var(--primary); }
    .logo { font-size: 32px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: -0.5px; }
    .logo span { color: var(--primary); }
    .sibling-tag { font-size: 14px; color: #888; text-transform: none; font-weight: 400; display: block; margin-top: 5px; }
    .container { max-width: 800px; margin: -40px auto 60px; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: var(--dark); font-size: 26px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
    h2 { color: var(--dark); font-size: 18px; border-left: 4px solid var(--primary); padding-left: 15px; margin-top: 35px; }
    .compliance-box { background: #faf7f2; border: 1px solid #e6ded4; padding: 25px; border-radius: 12px; margin: 25px 0; }
    .compliance-box p { margin: 8px 0; font-weight: 600; font-size: 15px; color: #5d4a36; }
    .highlight { color: var(--primary); font-weight: bold; }
    footer { text-align: center; font-size: 13px; color: #777; padding-bottom: 50px; }
    @media (max-width: 600px) { .container { margin: 15px; padding: 25px; border-radius: 12px; } header { padding: 40px 15px; } }
  </style>
</head>
<body>

<header>
  <p class="logo">Good Boy, <span>Rocky!</span></p>
  <span class="sibling-tag">Featuring Luna the Yorkie-Maltese</span>
</header>
